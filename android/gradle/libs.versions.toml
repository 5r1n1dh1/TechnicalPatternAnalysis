[plugins]
android-application = { version = "7.6.2", id = "com.android.tools.build:android-gradle-plugin" }
kotlin-android = { version = "1.9.21", id = "org.jetbrains.kotlin:kotlin-android" }
kotlin-compose = { version = "1.5.1", id = "org.jetbrains.kotlin:kotlin-compose" }
