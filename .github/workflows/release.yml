name: Release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${TAG:-v1.0.2}"
          if ! gh api "repos/${{ github.repository }}/releases/tags/$TAG" --silent; then
            echo "Tag $TAG does not exist; creating release manually..."
            gh release create "$TAG" --generate-notes --title "$TAG" --notes "Release $TAG — CI green, APK attached."
          else
            echo "Tag $TAG exists; attaching release artifact..."
          fi
      - name: Download release-apk from the latest successful CI run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID=$(gh run list --workflow=ci.yml --branch=main --status=success --limit 1 --json databaseId -q '.[0].databaseId')
          echo "latest successful CI run: ${RUN_ID:-none}"
          if [ -n "$RUN_ID" ]; then
            gh run download "$RUN_ID" --name release-apk --dir artifacts || echo "download skipped"
          fi
          ls -l artifacts || true
      - name: Attach APK to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${TAG:-v1.0.2}"
          APK=$(ls artifacts/*.apk 2>/dev/null | head -n1)
          if [ -n "$APK" ]; then
            echo "Attaching $APK to release $TAG"
            gh release upload "$TAG" "$APK" --clobber || echo "Upload skipped (artifact not found or release missing)"
          else
            echo "No APK artifact found; skipping upload."
          fi
      - name: Confirm release secrets
        run: |
          echo "VERCEL_ORG_ID=${VERCEL_ORG_ID:-not set}"
          echo "VERCEL_PROJECT_ID=${VERCEL_PROJECT_ID:-not set}"
          [ -n "$VERCEL_PROJECT_ID" ] && [ -n "$VERCEL_ORG_ID" ] || { echo "WARNING: Vercel secrets missing"; exit 0; }
