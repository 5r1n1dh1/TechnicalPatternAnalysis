name: Deploy to Vercel
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm i -g vercel@latest
      - name: Deploy server
        id: deploy
        env:
          VERCEL_API_KEY: ${{ secrets.VERCEL_API_KEY }}
        run: npx vercel@latest deploy --prod --token=$VERCEL_API_KEY --cwd server --env TPA_DEBUG_ERRORS=1
      - name: Verify smoke (production)
        run: |
          URL="${VERCEL_PROD_URL:-https://myaiinvestment.vercel.app}"
          echo "Smoke test: $URL/api/health"
          curl -sf --max-time 10 "$URL/api/health" || (sleep 5 && curl -sf --max-time 10 "$URL/api/health") || echo "SMOKE FAIL: /api/health"
          echo "Smoke test: $URL/api/search?q=RELIANCE"
          curl -sf --max-time 10 "$URL/api/search?q=RELIANCE" || (sleep 5 && curl -sf --max-time 10 "$URL/api/search?q=RELIANCE") || echo "SMOKE FAIL: /api/search"
  smoke-test:
    needs: deploy
    runs-on: ubuntu-latest
    env:
      BASE_URL: ${{ vars.VERCEL_PROD_URL || 'https://myaiinvestment.vercel.app' }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm i -g vercel@latest
      # Records failures instead of exiting, so the log-dump step always runs.
      - name: Smoke test production endpoints
        id: smoke
        run: |
          echo "SMOKE_FAILED=0" >> "$GITHUB_ENV"
          failed=0
          echo "Smoke-testing $BASE_URL"
          for path in "/api/health" "/api/search?q=RELIANCE"; do
            code=$(curl -s -o /tmp/resp.json -w '%{http_code}' -L --max-time 10 "$BASE_URL$path" || true)
            if [ "$code" != "200" ]; then
              # retry once
              sleep 5
              code=$(curl -s -o /tmp/resp.json -w '%{http_code}' -L --max-time 10 "$BASE_URL$path" || true)
            fi
            echo "$path -> HTTP $code"
            head -c 500 /tmp/resp.json; echo
            if [ "$code" != "200" ]; then
              echo "::warning::Smoke test failed for $path (HTTP $code)"
              failed=1
              continue
            fi
            # Guard against Vercel serving the Python source as a static asset
            # (HTTP 200 but text/plain) or an opaque runtime crash.
            if ! grep -q '"' /tmp/resp.json; then
              echo "::warning::Smoke test failed for $path (body is not JSON)"
              failed=1
            fi
            if grep -q 'FUNCTION_INVOCATION_FAILED' /tmp/resp.json; then
              echo "::warning::Smoke test failed for $path (function invocation failed)"
              failed=1
            fi
          done
          echo "SMOKE_FAILED=$failed" >> "$GITHUB_ENV"
          echo "Smoke results recorded (SMOKE_FAILED=$failed); dumping runtime logs next"
      - name: Dump Vercel runtime logs
        if: always()
        env:
          VERCEL_API_KEY: ${{ secrets.VERCEL_API_KEY }}
        run: |
          echo "=== vercel inspect --logs ($BASE_URL) ==="
          vercel inspect "$BASE_URL" --logs --token="$VERCEL_API_KEY" 2>&1 || true
          echo
          echo "=== vercel inspect --logs ($BASE_URL, --cwd server) ==="
          vercel inspect "$BASE_URL" --logs --token="$VERCEL_API_KEY" --cwd server 2>&1 || true
      - name: Fail if smoke test failed
        if: always()
        run: |
          if [ "${SMOKE_FAILED:-0}" != "0" ]; then
            echo "::error::Smoke test failed; see Vercel runtime logs above"
            exit 1
          fi
          echo "Smoke test passed"
