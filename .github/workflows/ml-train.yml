name: ML Model Training
# Deliverable #2: trains the pooled UP/DOWN/SIDEWAYS model and publishes the
# resulting artifacts. Runs on demand, on pipeline changes, and weekdays after
# the EOD pipeline has refreshed history.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'pipeline/**'
  schedule:
    - cron: '0 15 * * 1-5'

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pipeline/requirements.txt
      - name: Train model
        run: python -m pipeline.train
      - name: Upload model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tpa-models
          path: tpa-models/
          if-no-files-found: error
          retention-days: 30
