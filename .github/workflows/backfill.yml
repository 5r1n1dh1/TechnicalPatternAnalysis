name: Backfill Pipeline

on:
  workflow_dispatch:

jobs:
  backfill:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pipeline/requirements.txt

      - name: Run backfill
        run: |
          python -m pipeline.backfill

      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add history.parquet pipeline/ 2>/dev/null || true
          git commit -m "Backfill pipeline run $(date +'%Y-%m-%d')" -q || echo "No changes to commit"
          git push -q || echo "No push needed"
