name: EOD Pipeline

on:
  schedule:
    - cron: '30 13 * * 1-5'  # 19:00 IST Mon-Fri
  workflow_dispatch:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pipeline/requirements.txt

      - name: Holiday guard
        run: |
          python -c "
import sys; sys.path.insert(0, '.')
from pipeline import eod
print(eod.validate_date(eod.datetime.now().strftime('%d%m%Y')))
"

      - name: Run pipeline
        run: |
          python -m pipeline.eod run

      - name: Sanity check
        run: |
          python -m pytest pipeline/tests/test_eod.py -q 2>&1 | tail -20

      - name: Commit changes
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add pipeline/ server/data/ history.parquet 2>/dev/null || true
          git commit -m "EOD pipeline run $(date +'%Y-%m-%d')" -q || echo "No changes to commit"
          git push -q || echo "No push needed"

      - name: Deploy to Vercel
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          VERCEL_API_KEY: ${{ secrets.VERCEL_API_KEY }}
        run: |
          if [ -n "$VERCEL_API_KEY" ]; then
            vercel pull --yes --environment=production --token=$VERCEL_API_KEY 2>&1 | tail -5 || true
            vercel deploy --prod --token=$VERCEL_API_KEY --cwd server 2>&1 | tail -10 || true
          fi
