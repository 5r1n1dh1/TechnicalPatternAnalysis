name: Universe Refresh
# Secrets come from GitHub secrets (VERCEL_API_KEY, VERCEL_ORG_ID, VERCEL_PROJECT_ID, KAGGLE_API_KEY)
on:
  schedule:
    - cron: '0 0 1 * *'  # Monthly (UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Setup
        run: |
          python -m pip install --upgrade pip
          pip install -r pipeline/requirements.txt
      - name: Run universe refresh
        env:
          VERCEL_API_KEY: ${{ secrets.VERCEL_API_KEY }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          KAGGLE_API_KEY: ${{ secrets.KAGGLE_API_KEY }}
        run: |
          python -m pytest pipeline/tests/test_eod.py -q || true
          python pipeline/eod.py run 2>/dev/null || true
          python pipeline/backfill.py 2>/dev/null || true
