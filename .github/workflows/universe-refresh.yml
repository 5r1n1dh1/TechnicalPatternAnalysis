name: Universe Refresh

on:
  schedule:
    - cron: '0 0 1 * *'  # Monthly on 1st
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pipeline/requirements.txt

      - name: Refresh universe
        run: |
          python -c "
import json, os
# minimal stub universe
universe = {'symbols': ['^BSESN', 'NIFTY50'], 'updated': '$(date -Iseconds)'}
os.makedirs('server/data', exist_ok=True)
with open('server/data/symbols.json', 'w') as f:
    json.dump(universe, f, indent=2)
print('done')
"

      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add server/data/symbols.json 2>/dev/null || true
          git commit -m "Universe refresh $(date +'%Y-%m-%d')" -q || echo "No changes to commit"
          git push -q || echo "No push needed"
